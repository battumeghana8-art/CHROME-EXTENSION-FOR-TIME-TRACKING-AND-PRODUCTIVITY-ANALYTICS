<!DOCTYPE html>
<html>

<head>
    <title>Productivity Tracker</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Productivity Tracker</h1>
        <p>Track your browsing habits</p>
    </div>

    <div class="summary-card">
        <h2 id="score">Total Time: 0 mins</h2>
    </div>

    <h3>Website Usage</h3>

<div id="stats"></div>

<h3>Weekly Productivity Report</h3>

<div class="summary-card">
    <p id="productiveTime">Productive Time: 0 min</p>
    <p id="unproductiveTime">Unproductive Time: 0 min</p>
    <p id="productivityScore">Productivity Score: 0%</p>
</div>

<button id="resetBtn">
    Reset Data
</button>

</div>

<script src="popup.js"></script>

</body>

</html>
